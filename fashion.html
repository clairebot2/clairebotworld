    .parent {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        grid-template-rows: repeat(7, 1fr);
        gap: 8px;
        height: 100%;
        width: 1200px;
        margin: auto;
        justify-items: center;
        align-items: center;
        padding: 10px;
        border-radius: 0;
    }  
    .div1 {
        grid-column: span 4 / span 4;
        background-color: white;
    }
    .div2 {
        grid-row: span 6 / span 6;
        grid-column-start: 5;
    }
    .div3 {
        grid-column-start: 5;
        grid-row-start: 7;
    }
    .div4 {
        grid-column: span 2 / span 2;

        grid-column-start: 1;
        grid-row-start: 2;

    #gallerywrapper {
        width:640px;
        height:450px;
        margin:0 auto;
        position:relative;
     } 
    #gallerywrapper #gallery {
        position:absolute;
        left:0;
        top:0;
        height:450px;
        width:640px;
        overflow:hidden;
        text-align:center;
     } 
    #gallerywrapper #gallery div {
        width:640px; height:900px; 
        padding-top:10px; 
        position:relative;
     } 
     #gallerywrapper #gallery div img {
        clear:both; 
        display:block; 
        margin:0 auto; 
        border:0;
     }     
     #gallerywrapper #gallery div h3 {
        padding:10px 0 0 0; 
        margin:0; 
        font-size:18px;
     } 
    #gallerywrapper #gallery div p {
        padding:5px 0; 
        margin:0; 
        font-size:12px; 
        line-height:18px;
     } 
    #gallery .previous{ 
        position: absolute;
  		top: 50%;
  		transform: translateY(-50%);
  		width: 44px;       
  		height: 44px;
  		z-index: 10;
		background-image: url(./images/back.gif);

		right: 12px;
     }
