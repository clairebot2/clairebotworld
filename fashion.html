<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>fashion</title>
    <link rel="icon" type="image/x-icon" href="./images/favicon.gif">
  <style>
    body{
        background-image: url(./images/tokidoki.png);
        align-items: center;
        justify-content: center;
        margin: 50px auto;
    }
    @font-face{
        font-family:"Magazine";
        src:url("./fonts/MagazineLetterByBrntlbrnl-Regular.ttf") format("truetype");
    }
    h1{
        font-family:"Magazine";
        color: black;
    }
    .parent {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        grid-template-rows: repeat(7, 1fr);
        gap: 8px;
        height: 100%;
        width: 1200px;
        margin: auto;
        justify-items: center;
        align-items: center;
        padding: 10px;
        border-radius: 0;
    }  
    .div4 {
        grid-column: span 4 / span 4;
        background-color: white;
    }
    .div5 {
        grid-column: span 4 / span 4;
        grid-row: span 6 / span 6;
        grid-column-start: 1;
        grid-row-start: 2;
        background-color: white;
    }
    .div6 {
        grid-column-start: 5;
        grid-row-start: 7;
    }
    .div11 {
        grid-row: span 6 / span 6;
        grid-column-start: 5;
        grid-row-start: 1;
   }
  </style>
</head>
    <body>
            <div class="parent">
            <div class="div4">
                <h1>Welcome to my Wardrobe</h1>
            </div>
            <div class="div5">5</div>
            <div class="div6">
                <a href="home.html">
                    <img src= "./images/hysterichome.gif" alt="home">
                </a>
            </div>
            <div class="div11">
                <img src= "./images/doll.png" alt="pixel doll">
            </div>
        </div>
    </body>
</html>
