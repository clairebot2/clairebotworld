<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>blog</title>
    <link rel="icon" type="image/x-icon" href="./images/favicon.gif">
    <style>
        body{
            background-image: url(./images/bgfan.gif);
        }
        .parent {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(6, 1fr);
            gap: 8px;
        }
    
        .div1 {
            grid-row: span 3 / span 3;
        }

        .div2 {
            grid-column: span 2 / span 2;
            grid-row: span 6 / span 6;
        }
        .div3 {
            grid-row: span 3 / span 3;
            grid-column-start: 1;
            grid-row-start: 4;
        }
        .div4 {
            grid-row: span 3 / span 3;
            grid-column-start: 4;
            grid-row-start: 1;
        }
        .div5 {
            grid-row: span 3 / span 3;
            grid-column-start: 4;
            grid-row-start: 4;
        }
    </style>
</head>
<body>
    <div class="parent">
    <div class="div1"><img src="./images/swanpond.gif" alt="swan swimming across pond"></div>
    <div class="div2">blog</div>
    <div class="div3"><img src="./images/februarybaby.gif" alt="february baby"></div>
    <div class="div4"><img src="./images/fairy.gif" alt="fairy"></div>
    <div class="div5"><img src="./images/dove.gif" alt="dove"></div>
    </div>
</body>
</html>
