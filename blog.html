<!DOCTYPE html>
<html lang="en">
<head>

    <title>blog</title>
    <link rel="icon" type="image/x-icon" href="./images/favicon.gif">
    <style>
        body{

        @font-face {
            font-family:"Waif";
            src:url(./fonts/Waif.ttf);

        .parent {

            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(4, 1fr);
            grid-auto-rows: 1fr;
            gap: 8px;
            width: 720px;
            height: 520px;      
            margin: 0 auto;
            justify-items: stretch;
            align-items: stretch;
                }
        .stars {
        border-image:  url('data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAACoAAAAqCAYAAADFw8lbAAAAAXNSR0IArs4c6QAAAOdJREFUWEftmEEOgCAMBOG9vsf3ajxwwZjd2tWwitcKDFMLjbWYPNWEs0xQdabkRre1bAdkXbTZ+g9oM4hSnTWcNmoD2kxeAWdNtvnTRm1Bm0F19cuNDg+Kqj4blxnNgqDxExQZisYvjaqrFoGh9b4D2ptQ3TTRmwwaHRY0ulP07aE4u97JKDsQAbBxdj3f1L/VDbEmYZuHzjU2tex7aD2YetVxhIBvg6KJ347PpkRt/H9G+2JAxRE1LjNqB/pUEyM3OiyozS8dG9A+1epqh01J9Pjouy51jyArprsbY8dNUNYU+56N0R2B1XgrWUNKMwAAAABJRU5ErkJggg==') 14 /  14px / 0 round;
        border-width:  14px;
        border-style:  solid; 
        height: 100%
        width: 100%;
        box-sizing: border-box;
                }
  
    
    .div1 {
        grid-row: span 2 / span 2;
        background-color: powderblue;
        width: 100%;
        height: 100%;
        }

.div2 {
    grid-row: span 2 / span 2;
    grid-column-start: 1;
    grid-row-start: 3;
    background-color: powderblue;
    width: 100%;
    height: 100%;
}

.div3 {
    grid-column: 2 / span 2;
    grid-row: 1 / span 4;
    grid-column-start: 2;
    grid-row-start: 1;
    height: 100%;
    width: 100%;
}

.div4 {
    grid-row: span 2 / span 2;
    grid-column-start: 4;
    grid-row-start: 1;
    background-color: powderblue;
    height: 100%;
    width: 100%;
}

.div5 {
    grid-row: span 2 / span 2;
    grid-column-start: 4;
    grid-row-start: 3;
    background-color: powderblue;
    height: 100%;
    width: 100%;
}
        .div3 iframe{
            height: 100%;
            width: 100%;
            border: none;
            display: block;
        }   
    </style>
</head>
<body>
    <div class="parent">
    <div class="div1"><img src="./images/swanpond.gif" alt="swan swimming across pond">
    <a href="https://blog.clairebot.world">visit my bear blog site</a>
    </div>
    <div class="div2">
        <p>i write about personal stuff on my blog, like my boyfriend having cancer. i also write about making this website, having a flip phone, and whatever else i feel like. i started this blog before i made this website, it inspired me.</p>
    </div>
    <div class="div3 stars">
        <iframe src="https://blog.clairebot.world/" title="my blog"></iframe>
    </div>
    <div class="div4">
        <p>thank you for checking it out.</p>
    </div>
    <div class="div5"><a href="./home.html"><img src="./images/househome.gif" alt="home"></a></div>
    </div>
</body>
</html>
