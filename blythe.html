<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>fashion</title>
    <link rel="icon" type="image/x-icon" href="./images/favicon.gif">
  <style>
      body{
          background-image: url(./images/blythedots.gif);
      }
          @font-face{
            font-family:"MagicWand";
            src:url("./fonts/MagicWand.ttf") format("truetype");
            }
      h1{
          font-family:"MagicWand";
          color:DeepPink;
          font-size: 150px;
          text-align: center;
      }
    .parent {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        grid-template-rows: repeat(5, 1fr);
        gap: 8px;
    }  
    .div1 {
        grid-column: span 4 / span 4;
    }
    .div2 {
        grid-column: span 2 / span 2;
        grid-row: span 4 / span 4;
        grid-column-start: 2;
        grid-row-start: 2;
    }
    .div3 {
        grid-row: span 2 / span 2;
        grid-column-start: 1;
        grid-row-start: 2;
    }
    .div4 {
        grid-row: span 2 / span 2;
        grid-column-start: 1;
        grid-row-start: 4;
    }
    .div5 {
        grid-row: span 2 / span 2;
        grid-column-start: 4;
        grid-row-start: 2;
    }
    .div6 {
        grid-row: span 2 / span 2;
        grid-column-start: 4;
        grid-row-start: 4;
    }
    </style>
    </head>
    <body>
        <div class="parent">
        <div class="div1"><h1>My Blythe Doll</h1></div>
        <div class="div2">2</div>
        <div class="div3">3</div>
        <div class="div4">4</div>
        <div class="div5">5</div>
        <div class="div6">6</div>
        </div>
    </body>
</html>
